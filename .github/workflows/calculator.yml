name: Calculator checks

on:
  push:
    paths:
      - "calculator/**"
      - ".github/workflows/calculator*.yml"
  pull_request:
    paths:
      - "calculator/**"
      - ".github/workflows/calculator*.yml"

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: calculator

    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.3
        with:
          cache-dependency-glob: calculator/uv.lock

      - name: Install dependencies
        run: make install

      - name: Lint
        run: make lint

      - name: Test with coverage
        run: make coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: calculator-coverage
          path: calculator/htmlcov/
