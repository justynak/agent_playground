name: Integration Tests

on:
  issue_comment:
    types: [created]

# Nothing by default; each job grants only what integration-tests-run.yml needs.
permissions: {}

jobs:
  integration:
    if: |
      github.event.issue.pull_request != null &&
      contains(github.event.comment.body, 'integration tests') &&
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)
    permissions:
      contents: read        # check out the PR
      statuses: write       # commit status in the PR checks box
      pull-requests: write  # result comment on the PR
      issues: write         # reactions on the trigger comment
    uses: ./.github/workflows/integration-tests-run.yml
    with:
      project: calculator
      status-context: integration / calculator
    secrets:
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}

  eu-ai-act-integration:
    if: |
      github.event.issue.pull_request != null &&
      contains(github.event.comment.body, '/integration-test eu-ai-act-news') &&
      github.event.comment.user.login == github.repository_owner
    permissions:
      contents: read
      statuses: write
      pull-requests: write
      issues: write
    uses: ./.github/workflows/integration-tests-run.yml
    with:
      project: eu_ai_act_news
      status-context: integration / eu-ai-act-news
    secrets:
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
