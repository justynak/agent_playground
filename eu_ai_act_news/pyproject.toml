[project]
name = "eu-ai-act-news"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "feedparser>=6.0.10",
    "openai>=1.0.0",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff==0.16.7",
]

[tool.ruff.lint]
# BLE001 (blind except) is intentionally allowed: this is a scheduled batch job over
# untrusted network I/O (feeds, article fetches, LLM calls) where one bad item must not
# crash the whole run. Every catch site logs/returns an error marker instead of swallowing.
ignore = ["BLE001"]

[tool.pytest.ini_options]
# Put the project root on sys.path so tests can `import news_agent` without a
# checked-in sys.path hack. Resolved relative to the rootdir (this file).
pythonpath = ["."]
markers = [
    "integration: requires live DeepSeek API and network access (not run in standard CI)",
]
