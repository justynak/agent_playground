name: EU AI Act News checks

on:
  push:
    paths:
      - "eu_ai_act_news/**"
      - ".github/workflows/eu_ai_act_news*.yml"
  pull_request:
    paths:
      - "eu_ai_act_news/**"
      - ".github/workflows/eu_ai_act_news*.yml"

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: eu_ai_act_news

    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.3
        with:
          cache-dependency-glob: eu_ai_act_news/uv.lock

      - name: Install dependencies
        run: make install

      - name: Lint
        run: make lint

      - name: Test with coverage
        run: make coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: eu-ai-act-news-coverage
          path: eu_ai_act_news/htmlcov/
